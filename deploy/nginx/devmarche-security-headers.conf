# En-têtes de sécurité de DevMarché, inclus par devmarche.conf.
# À copier dans /etc/nginx/snippets/devmarche-security-headers.conf

# HSTS : HTTPS obligatoire pendant 1 an (n'activer qu'une fois HTTPS vérifié).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
# CSP : tout vient du site lui-même (polices et images auto-hébergées).
# 'unsafe-eval' : exigé par Alpine.js (évaluation des attributs x-…), embarqué par Livewire.
# 'unsafe-inline' : script anti-flash du thème et attributs style ; à remplacer par des nonces plus tard.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
