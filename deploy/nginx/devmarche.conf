# ---------------------------------------------------------------------------
# Nginx : DevMarché (exemple). À copier dans /etc/nginx/sites-available/devmarche,
# remplacer devmarche.example par le vrai domaine, puis lancer Certbot (12-deploiement.md).
# ---------------------------------------------------------------------------

# Brotli si le module est installé (paquet libnginx-mod-http-brotli-filter / -static) :
# décommenter les lignes « brotli » plus bas. Sinon gzip suffit.

# HTTP : tout part vers HTTPS (Certbot garde le défi ACME sur ce bloc).
server {
    listen 80;
    listen [::]:80;
    server_name devmarche.example;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name devmarche.example;

    root /var/www/devmarche/public;
    index index.php;
    charset utf-8;

    # Certificats Let's Encrypt (posés par Certbot)
    ssl_certificate     /etc/letsencrypt/live/devmarche.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/devmarche.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 4m; # avatars (2 Mo max côté Laravel) avec de la marge

    # --- En-têtes de sécurité (fichier à part : Nginx n'hérite pas des add_header du serveur
    #     dans un bloc location qui a les siens, il faut donc l'inclure partout) ---
    include snippets/devmarche-security-headers.conf;

    # --- Compression -----------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/xml application/javascript application/json image/svg+xml application/manifest+json;
    # brotli on;
    # brotli_comp_level 5;
    # brotli_types text/plain text/css text/xml application/xml application/javascript application/json image/svg+xml application/manifest+json;

    # --- Cache long des fichiers « fingerprintés » par Vite (le nom change à chaque build) ---
    location /build/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include snippets/devmarche-security-headers.conf;
        access_log off;
        try_files $uri =404;
    }

    # Polices, images, icônes : cache d'un mois (noms stables).
    location ~* \.(?:woff2|webp|png|jpg|jpeg|svg|ico)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        include snippets/devmarche-security-headers.conf;
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }

    # robots.txt et sitemap.xml sont générés par Laravel : pas de fichier statique.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/devmarche.sock; # pool dédié : deploy/php-fpm/devmarche.conf
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    # Aucun autre fichier PHP, ni fichier caché (.env, .git…), n'est servi.
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known).* { deny all; }
}
