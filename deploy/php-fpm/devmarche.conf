; Pool PHP-FPM dédié à DevMarché : PHP tourne sous l'utilisateur « devmarche »,
; propriétaire du code, de storage/ et de bootstrap/cache/ (pas de chmod 777).
; À copier dans /etc/php/8.2/fpm/pool.d/devmarche.conf (guide : 12-deploiement.md)

[devmarche]
user = devmarche
group = devmarche

listen = /run/php/devmarche.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Serveur de 2 vCPU et 4 Go : 10 processus au plus (~40 Mo chacun).
pm = dynamic
pm.max_children = 10
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 4
pm.max_requests = 500

php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 4M
php_admin_value[post_max_size] = 6M
php_admin_flag[expose_php] = off

; OPcache : le code ne change qu'au déploiement (deploy.sh recharge PHP-FPM).
php_admin_value[opcache.enable] = 1
php_admin_value[opcache.memory_consumption] = 128
php_admin_value[opcache.max_accelerated_files] = 20000
php_admin_value[opcache.validate_timestamps] = 0
